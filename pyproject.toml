[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visualping-crawler"
version = "1.0.0"
description = "Authenticated web crawler that hunts for VISUALPING{...} passwords"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ocr = ["pytesseract>=0.3"]   # also needs a `tesseract` binary on PATH

[project.scripts]
crawler = "crawler.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
